<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13242A">
<title>QuranToSoul — قرآن لفظ بہ لفظ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New&family=Noto+Nastaliq+Urdu:wght@400;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#16262B; --muted:#5E716C; --line:#D5DEDB;
  --lapis:#1E5486; --saffron:#B97810; --sage:#3E7A62; --hit:#F6E3BD; --live:#D7E6F4; --bar:#16353F; --onbar:#EEF2F1;
  --ar:'Amiri Quran','Amiri','Traditional Arabic','Scheherazade New',serif;
  --arstudy:'Scheherazade New','Noto Naskh Arabic','Amiri','Traditional Arabic',serif;
  --ur:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Urdu Typesetting',serif;
  --en:'Crimson Pro',Georgia,'Times New Roman',serif;
  --arsize:30px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1D; --surface:#14252A; --ink:#E4ECE9; --muted:#93A8A2; --line:#26393E;
    --lapis:#86B8E6; --saffron:#E8AE4C; --sage:#7DC3A4; --hit:#3D3218; --live:#1C3449; --bar:#E4ECE9; --onbar:#0E1A1D;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1D; --surface:#14252A; --ink:#E4ECE9; --muted:#93A8A2; --line:#26393E;
  --lapis:#86B8E6; --saffron:#E8AE4C; --sage:#7DC3A4; --hit:#3D3218; --live:#1C3449; --bar:#E4ECE9; --onbar:#0E1A1D;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ur);font-size:16px;line-height:2.1;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:4px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;
  padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .title{flex:1;text-align:start;padding:2px 4px}
.bar .title b{font-family:var(--ar);font-size:24px;font-weight:400;line-height:1.5}
.bar .title small{display:block;font-family:var(--en);color:var(--muted);font-size:13px;line-height:1.2;direction:ltr;text-align:start}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:10px}
.iconbtn:hover{background:var(--bg)}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}

main{max-width:760px;margin:0 auto;padding:8px 10px 120px}
.bism{font-family:var(--ar);font-size:calc(var(--arsize) * .95);text-align:center;margin:18px 0 8px;line-height:2}

/* ayah */
.ayah{padding:14px 4px 16px;border-bottom:1px solid var(--line)}
.words{display:flex;flex-wrap:wrap;gap:4px 2px;align-items:flex-start}
.last{display:inline-flex;align-items:flex-start}
.w{display:inline-flex;flex-direction:column;align-items:center;padding:2px 6px 4px;border-radius:8px;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background .15s}
.w .ar{font-family:var(--ar);font-size:var(--arsize);line-height:2.3}
.w .g{font-family:var(--en);font-size:12.5px;color:var(--muted);line-height:1.25;max-width:9.5em;text-align:center;margin-top:6px}
.w .g.ur{font-family:var(--ur);font-size:12px;line-height:1.9}
.nowbw .w .g{display:none}
.w.press{background:var(--hit)}
.w.hit{background:var(--hit);box-shadow:inset 0 -2px 0 var(--saffron)}
.w.live{background:var(--live)}
.w.live .ar{color:var(--lapis)}
.ayah.playing{background:var(--surface);border-radius:12px}
.end{cursor:pointer;font-family:var(--ar);font-size:calc(var(--arsize) * .62);display:inline-grid;place-items:center;
  min-width:1.9em;height:1.9em;margin:calc(var(--arsize)*.35) 4px 0;border:1.5px solid var(--saffron);border-radius:50%;color:var(--saffron);line-height:1}
.tr{margin:8px 4px 0;font-size:15px;line-height:2.15;color:var(--ink)}
.tr.en{font-family:var(--en);font-size:17px;line-height:1.5;direction:ltr;text-align:left}
.tr .ref{color:var(--muted);font-size:12px}

.surah-foot{margin:28px 4px 0;color:var(--muted);font-size:12.5px;line-height:2}
.surah-foot .en{font-family:var(--en);direction:ltr;text-align:left;font-size:13px;line-height:1.5}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:6px 16px;border-radius:12px;font-size:14px;z-index:40;
  max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast .tar{font-family:var(--ar);font-size:22px;margin-inline-end:8px}

/* sheet & drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;
  max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;
  padding:6px 18px calc(env(safe-area-inset-bottom,0px) + 24px);max-width:760px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 4px}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(380px,92vw);z-index:31;background:var(--surface);
  transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.drawer,.scrim,.toast,.w{transition:none}}

/* word sheet */
.wd-head{text-align:center;padding:4px 0 2px}
.wd-word{font-family:var(--ar);font-size:64px;line-height:1.7}
.seg-p{color:var(--sage)} .seg-s{color:var(--saffron)} .seg-{color:var(--ink)}
.wd-mean{font-size:20px;line-height:2}
.wd-mean.en{font-family:var(--en);font-size:21px;direction:ltr}
.wd-sub{font-family:var(--en);color:var(--muted);font-size:14px;direction:ltr;line-height:1.4}
.legend{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--muted);margin:4px 0 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-start:4px;vertical-align:middle}
h3{font-size:15px;font-weight:600;margin:20px 0 4px;color:var(--lapis);line-height:2}
.seg-row{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:10px 0;border-top:1px solid var(--line)}
.seg-row .sar{font-family:var(--ar);font-size:34px;line-height:1.6;min-width:1.6em;text-align:center}
.seg-row b{font-weight:600;font-size:15px}
.seg-row ul{margin:0;padding:0;padding-inline-start:18px;font-size:14px;color:var(--muted);line-height:2.05}
.seg-row .lem{font-size:13.5px;margin-top:2px}
.seg-row .lem span{font-family:var(--ar);font-size:20px}
.root{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.root{margin-bottom:10px}
.root .letters{font-family:var(--ar);font-size:40px;letter-spacing:.35em;color:var(--lapis);line-height:2}
.root .cnt{color:var(--muted);font-size:14px}
.lemlist{list-style:none;margin:0;padding:0}
.lemlist li button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:start;
  padding:4px 6px;border-radius:8px}
.lemlist li button:hover,.lemlist li button[aria-pressed="true"]{background:var(--bg)}
.lemlist .la{font-family:var(--ar);font-size:24px;line-height:1.7}
.lemlist .lg{font-family:var(--en);font-size:14.5px;color:var(--muted);direction:ltr;text-align:left;line-height:1.3}
.lemlist .lc{font-size:13px;color:var(--muted)}
.occ{list-style:none;margin:0;padding:0}
.occ li button{display:block;width:100%;text-align:start;padding:8px 4px;border-bottom:1px solid var(--line)}
.occ .oa{font-family:var(--ar);font-size:22px;line-height:2}
.occ .oa mark{background:var(--hit);color:inherit;border-radius:4px;box-shadow:inset 0 -2px 0 var(--saffron)}
.occ .or{font-size:12px;color:var(--muted)}
.more{margin:10px auto 0;display:block;border:1px solid var(--line);border-radius:10px;padding:2px 16px}
.draft{margin-top:18px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* drawer content */
.dr-top{padding:12px 14px 6px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:4px;border-radius:9px;border:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{width:100%;font:inherit;font-size:15px;padding:4px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dr-body{overflow-y:auto;flex:1;padding:4px 8px 20px;overscroll-behavior:contain}
.sl{list-style:none;margin:0;padding:0}
.sl button{width:100%;display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;text-align:start;padding:6px;border-radius:9px}
.sl button:hover,.sl button[aria-current="true"]{background:var(--bg)}
.sl .num{font-size:13px;color:var(--muted);text-align:center}
.sl .nm{font-family:var(--en);font-size:15.5px;direction:ltr;text-align:right;line-height:1.3}
.sl .nm small{display:block;color:var(--muted);font-size:12.5px}
.sl .na{font-family:var(--ar);font-size:22px;line-height:1.6}
.juz{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px}
.juz button{border:1px solid var(--line);border-radius:9px;padding:2px 0}
.set{padding:10px 10px}
.set label,.set .lbl{display:block;font-size:14px;margin:14px 0 4px;color:var(--muted)}
.set select{width:100%;font:inherit;font-size:15px;padding:2px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.set input[type=range]{width:100%;accent-color:var(--lapis)}
.seg3{display:flex;gap:6px}
.seg3 button{flex:1;border:1px solid var(--line);border-radius:9px;padding:2px}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.about{font-size:12.5px;color:var(--muted);line-height:2;margin-top:22px}
.about .en{font-family:var(--en);direction:ltr;text-align:left;line-height:1.5;font-size:13px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* language */
.words,.wd-word,.seg-row .sar,.occ .oa,.lemlist .la,.root .letters,.bism,.sl .na,.toast .tar{direction:rtl}
.occ .oa{text-align:right}
.tr.ur{direction:rtl;text-align:right;font-family:var(--ur)}
html[lang="en"] body{font-family:var(--en);font-size:17px;line-height:1.55}
html[lang="en"] .tr.ur{font-size:15px;line-height:2.15}
html[lang="en"] h3{font-size:17px;line-height:1.6}
html[lang="en"] .seg-row ul{line-height:1.5;font-size:15px}
html[lang="en"] .player .info{line-height:1.35}
html[lang="en"] .about,html[lang="en"] .draft,html[lang="en"] .surah-foot{line-height:1.5}
html[dir="ltr"] .sl .nm{text-align:left}
html[dir="ltr"] .drawer{right:auto;left:0;transform:translateX(-105%)}
html[dir="ltr"] .drawer.on{transform:none}
.langpick{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px}
.langpick .box{text-align:center;max-width:360px;width:100%}
.langpick .mark{font-family:var(--ar);font-size:56px;line-height:2;color:var(--lapis);margin-bottom:8px}
.langpick p{color:var(--muted);margin:0 0 22px;font-family:var(--en);font-size:16px;line-height:1.5}
.langpick button{display:block;width:100%;margin:10px 0;padding:10px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:22px}
.langpick button:hover{border-color:var(--lapis)}
.langpick .ur{font-family:var(--ur);line-height:2}
.langpick .en{font-family:var(--en)}
/* word study panel: clear letter-by-letter Arabic (Amiri Quran stacks letters calligraphically) */
.wd-word,.seg-row .sar,.lemlist .la,.root .letters,.seg-row .lem span,#occH span{font-family:var(--arstudy)}
.wd-word{font-size:58px;line-height:1.8}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;align-items:center;gap:4px;
  background:var(--bar);color:var(--onbar);padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 6px)}
.player.on{display:flex}
.player .pb{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.player .pb svg{width:22px;height:22px;fill:var(--onbar)}
.player .pb.main{background:var(--saffron)}
.player .pb.main svg{fill:#16262B}
.player .info{flex:1;min-width:0;line-height:1.7;padding:0 6px}
.player .info b{font-weight:600;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .info small{font-size:12px;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .rep{min-width:44px;height:34px;border:1px solid currentColor;border-radius:17px;font-size:13px;padding:0 8px;opacity:.85}
.player .rep[aria-pressed="true"]{background:var(--onbar);color:var(--bar);opacity:1}
body.playing main{padding-bottom:180px}
body.playing .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 76px)}
.wd-actions{display:flex;justify-content:center;gap:8px;margin:6px 0 2px}
.wd-actions button{border:1px solid var(--line);border-radius:18px;padding:0 14px;font-size:14px}
/* ---------- QuranToSoul brand + v2 layout ---------- */
[hidden]{display:none!important}
:root{ --tabh:58px; --gold:#B8913A; --teal:#1F5C66; --night:#13242A; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --gold:#D4AF5A; --teal:#9CC9C0; } }
:root[data-theme="dark"]{ --gold:#D4AF5A; --teal:#9CC9C0; }
.bar{background:color-mix(in srgb, var(--surface) 88%, transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px)}
.brandmark{width:30px;height:30px;flex:none}
.end{border-color:var(--gold);color:var(--gold)}
.player{bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));padding-bottom:6px}
main{padding-bottom:calc(var(--tabh) + 120px)}
body.playing main{padding-bottom:calc(var(--tabh) + 180px)}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + var(--tabh) + 12px)}
body.playing .toast{bottom:calc(env(safe-area-inset-bottom,0px) + var(--tabh) + 72px)}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:26;display:flex;justify-content:center;gap:4px;
  background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(env(safe-area-inset-bottom,0px) + 4px);height:calc(var(--tabh) + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:12px;
  font-family:var(--en);font-size:12.5px;line-height:1.2;color:var(--muted)}
html[lang="ur"] .tabbar button{font-family:var(--ur);font-size:12px;line-height:1.6}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--teal)}
.tabbar button[aria-selected="true"] svg{stroke-width:2.2}

/* learn */
#learn{max-width:760px;margin:0 auto;padding:12px 14px calc(var(--tabh) + 40px)}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.meter{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--en);font-size:26px;font-weight:600;color:var(--ink);direction:ltr}
.meter h2{margin:0;font-size:17px;line-height:1.5;font-weight:600}
.meter p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
html[lang="ur"] .meter h2,html[lang="ur"] .meter p{line-height:2.1}
.stats{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;border-radius:12px;background:var(--bg);padding:8px 10px;text-align:center}
.stat b{display:block;font-family:var(--en);font-size:20px;line-height:1.3;direction:ltr}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:8px 18px;font-weight:600;
  background:var(--night);color:#F3EDE0;min-height:44px}
:root[data-theme="dark"] .btn{background:var(--gold);color:#13242A}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn{background:var(--gold);color:#13242A} }
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.lh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 4px 8px}
.lh h3{margin:0;color:var(--ink);font-size:16px}
.lh small{color:var(--muted);font-size:13px}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.deck{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px 6px;text-align:center;line-height:1.3}
.deck .dn{font-family:var(--en);font-size:12px;color:var(--muted);direction:ltr}
.deck .da{font-family:var(--arstudy);font-size:21px;line-height:1.9;direction:rtl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .bar2{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.deck .bar2 i{display:block;height:100%;background:var(--teal)}
.deck.done{border-color:var(--teal)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:start;line-height:1.4}
.game b{display:block;font-size:15.5px}
.game small{color:var(--muted);font-size:12.5px;display:block;margin-top:4px;line-height:1.5}
.game.soon{opacity:.55;cursor:default}
html[lang="ur"] .game b{line-height:2}
html[lang="ur"] .game small{line-height:1.9}

/* flashcard */
.fc-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fc-top .prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fc-top .prog i{display:block;height:100%;background:var(--gold);transition:width .25s}
.fc-top small{font-family:var(--en);color:var(--muted);font-size:13px;direction:ltr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;min-height:340px;padding:22px 18px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.card .big{font-family:var(--arstudy);font-size:62px;line-height:1.8;direction:rtl}
.card .typ{font-family:var(--en);color:var(--muted);font-size:13.5px;direction:ltr;line-height:1.4}
.card .tap{margin-top:18px;color:var(--muted);font-size:13px}
.card .mean{font-family:var(--en);font-size:24px;line-height:1.35;direction:ltr;margin-top:6px}

<script>
/* Move to qurantosoul.com: the old GitHub Pages link forwards there and carries the
   reader's saved data (last ayah, settings) in the #hash (never sent to any server). */
(function(){
  try {
    if (location.hostname.endsWith("github.io")) {
      var d = {};
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("q_") === 0) d[k] = localStorage.getItem(k); }
      location.replace("https://qurantosoul.com/" + location.search + "#move=" + encodeURIComponent(JSON.stringify(d)));
      return;
    }
    var m = location.hash.match(/^#move=(.*)$/);
    if (m) {
      var data = JSON.parse(decodeURIComponent(m[1]));
      for (var key in data) if (key.indexOf("q_") === 0 && localStorage.getItem(key) === null) localStorage.setItem(key, data[key]);
      history.replaceState(null, "", location.pathname + location.search);
    }
  } catch (e) {}
})();
</script>

/* ---------- data layer: embedded (single file) or fetched (GitHub Pages) ---------- */
const cache = {};
async function gunzip(b64){
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
function load(key, path){
  if (!cache[key]) {
    cache[key] = (window.EMBED
      ? gunzip(key.startsWith("t_") ? EMBED.t[key.slice(2)] : key.startsWith("s") ? EMBED.s[+key.slice(1)] : EMBED[key])
      : fetch(path).then(r => { if(!r.ok) throw new Error(path); return r.json(); })
    ).catch(e => { delete cache[key]; throw e; });
  }
  return cache[key];
}

async function openSurah(n, ayah = 1, word = null){
  closeAll();

  if (P.s && P.s !== n) stopPlayer();
  const S = META.surahs[n-1];
  $("#tAr").textContent = T("surahPre") + S.ar;
  $("#tEn").textContent = `${S.n}. ${S.tr} · ${S.en}`;
  if (!CUR || CUR.n !== n) $("#main").innerHTML = `<div class="loading">${T("loading")}</div>`;
  let d;
  try { d = await DATA.surah(n); }
  catch(e){ $("#main").innerHTML = `<div class="loading">${T("loadFail")}</div>`; return; }
  if (!CUR || CUR.n !== n) { CUR = d; render(); }
  const el = document.getElementById("a" + ayah);
  document.querySelectorAll(".w.hit").forEach(x => x.classList.remove("hit"));
  if (el) {
    let target = el;
    if (word != null) {
      const w = el.querySelector(`.w[data-i="${word-1}"]`);
      if (w) { w.classList.add("hit"); target = w; }
    }
    requestAnimationFrame(() => target.scrollIntoView({block: word != null ? "center" : "start"}));

}

function render(){
  const n = CUR.n, S = META.surahs[n-1];
  const trKey = settings.tr;
  let h = "";

  if (n !== 1 && n !== 9) h += '<div class="bism">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>';
  CUR.ayahs.forEach((A, ai) => {
    const a = ai + 1;
    h += `<article class="ayah" id="a${a}" data-a="${a}"><div class="words">`;
    A.w.forEach((w, i) => {
      const g = glossOf(w), last = i === A.w.length - 1;
      const wh = `<span class="w" data-a="${a}" data-i="${i}" tabindex="0"><span class="ar">${esc(w[0])}</span><span class="g${g.ur?" ur":""}" dir="${g.ur?"rtl":"ltr"}">${esc(g.t)}</span></span>`;
      h += last ? `<span class="last">${wh}<span class="end" data-play="${a}" role="button" tabindex="0" aria-label="${T("listen", a)}">${ud(a)}</span></span>` : wh;
    });
    h += `</div>`;
    const tx = A[trKey] || (trKey === "en2" ? A.en : "");
    if (trKey !== "none" && tx) h += `<p class="tr ${trKey.startsWith("en")?"en":"ur"}">${esc(tx)}</p>`;
    h += `</article>`;
  });
  const src = META.sources;
  const trName = {ur:src.ur1, ur2:src.ur2, en:src.en, en2:src.en2}[trKey] || "—";
  h += `<div class="surah-foot">${T("trLabel")} ${esc(trName)}
        <div class="nav">${n>1?`<button data-go="${n-1}">${T("prevS")}</button>`:"<span></span>"}${n<114?`<button data-go="${n+1}">${T("nextS")}</button>`:""}</div></div>`;
  $("#main").innerHTML = h;
  P.liveKey = null;
  if (P.s === n) markAyah();
  observeAyahs();
}

/* resume: remember the ayah at the top of the screen */
let io, saveT;
function observeAyahs(){
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    const vis = entries.filter(e => e.isIntersecting).map(e => +e.target.dataset.a);
    if (!vis.length || !CUR) return;
    clearTimeout(saveT);
    const n = CUR.n, a = Math.min(...vis);
    saveT = setTimeout(() => store.set("last", {s:n, a}), 400);
  }, {rootMargin:"-70px 0px -60% 0px"});
  document.querySelectorAll(".ayah").forEach(el => io.observe(el));
}

/* ---------- word sheet ---------- */
const spaced = r => [...r].join(" ");
function segHTML(segs){ return segs.map(s => `<span class="seg-${s[3]}">${esc(s[0])}</span>`).join(""); }

function openWord(a, i){
  const n = CUR.n, w = CUR.ayahs[a-1].w[i];
  const [ar, en, tl, ur, segs, stem] = w;
  const hasP = segs.some(s => s[3]==="p"), hasS = segs.some(s => s[3]==="s");
  let h = `<div class="wd-head"><div class="wd-word">${segHTML(segs)}</div>`;
  if (ur) h += `<div class="wd-mean">${esc(ur)}</div><div class="wd-sub">${esc(en)}</div>`;
  else h += `<div class="wd-mean en">${esc(en)}</div>`;
  h += `<div class="wd-sub">${esc(tl)} · ${n}:${a}:${i+1}</div>`;
  h += `<div class="wd-actions"><button data-wordaudio="${n}:${a}:${i+1}">${T("hearWord")}</button><button data-ayahaudio="${n}:${a}">${T("hearAyah")}</button>${lecFor(n, a) ? `<button data-lec="${lecFor(n, a)}">${T("tafseerBtn")}</button>` : ""}</div>`;
  if (segs.length > 1) h += `<div class="legend">${hasP?`<span><i style="background:var(--sage)"></i>${T("pre")}</span>`:""}<span><i style="background:var(--ink)"></i>${T("stem")}</span>${hasS?`<span><i style="background:var(--saffron)"></i>${T("suf")}</span>`:""}</div>`;
  h += `</div>`;

  h += `<h3>${T("gramH")}</h3>`;
  const G = (settings.lang === "en" && META.grammar_en) || META.grammar;
  segs.forEach(s => {
    const [title, lines] = G[s[1]];
    const L = s[2] >= 0 ? META.lemmas[s[2]] : null;
    h += `<div class="seg-row"><div class="sar seg-${s[3]}">${esc(s[0])}</div><div><b>${esc(title)}</b>`;
    if (lines.length) h += `<ul>${lines.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    if (L && s[3] === "" && L[2] >= 0) h += `<div class="lem">${T("base")} <span>${esc(L[0])}</span></div>`;
    h += `</div></div>`;
  });

  const L = stem >= 0 ? META.lemmas[stem] : null;
  if (L && L[2] >= 0) {
    const R = META.roots[L[2]];
    h += `<h3>${T("rootH")}</h3>
      <div class="root"><span class="letters">${esc(spaced(R[0]))}</span><span class="cnt">${T("rootCnt", R[2].length, R[1])}</span></div>
      <ul class="lemlist">${R[2].slice(0, 14).map(li => { const X = META.lemmas[li];
        return `<li><button data-lem="${li}" aria-pressed="${li===stem}"><span class="la">${esc(X[0])}</span><span class="lg">${esc(X[4])}</span><span class="lc">${T("times", X[3])}</span></button></li>`; }).join("")}</ul>`;
    if (R[2].length > 14) h += `<div class="cnt" style="color:var(--muted);font-size:13px">${T("moreW", R[2].length-14)}</div>`;
  }
  if (L) h += `<h3 id="occH">«<span style="font-family:var(--ar);font-size:22px">${esc(L[0])}</span>» ${T("inQuran", L[3])}</h3><ul class="occ" id="occList"></ul><div id="occMore"></div>`;
  h += `<div class="draft">${T("draft")}</div>`;

  $("#sheetBody").innerHTML = h;
  openSheet();
  if (L) showOcc(stem, `${n}:${a}:${i+1}`);
}

let occState = null;
async function showOcc(li, current){
  const occ = await DATA.occ();
  occState = { list: occ[li] || [], shown: 0, current, li };
  const L = META.lemmas[li];
  const hh = $("#occH"); if (hh) hh.innerHTML = `«<span style="font-family:var(--ar);font-size:22px">${esc(L[0])}</span>» ${T("inQuran", L[3])}`;
  $("#occList").innerHTML = "";
  await moreOcc();
}
async function moreOcc(){
  const st = occState, batch = st.list.slice(st.shown, st.shown + 12);
  st.shown += batch.length;
  const items = await Promise.all(batch.map(async loc => {
    const [s, a, w] = loc.split(":").map(Number);
    const d = await DATA.surah(s), A = d.ayahs[a-1];
    const text = A.w.map((x, k) => k === w-1 ? `<mark>${esc(x[0])}</mark>` : esc(x[0])).join(" ");
    return `<li><button data-loc="${loc}"><div class="oa">${text}</div><div class="or">${T("surahPre")}${esc(META.surahs[s-1].ar)} — ${T("num", s)}:${T("num", a)}${loc===st.current?T("thisAyah"):""}</div></button></li>`;
  }));
  $("#occList").insertAdjacentHTML("beforeend", items.join(""));
  $("#occMore").innerHTML = st.shown < st.list.length ? `<button class="more" id="btnMore">${T("more", st.list.length - st.shown)}</button>` : "";
}
$("#sheetBody").addEventListener("click", e => {
  const wa = e.target.closest("[data-wordaudio]");
  if (wa) { playWord(...wa.dataset.wordaudio.split(":").map(Number)); return; }
  const aa = e.target.closest("[data-ayahaudio]");

  const ob = e.target.closest("[data-loc]");
  if (ob) { const [s,a,w] = ob.dataset.loc.split(":").map(Number); openSurah(s, a, w); return; }
  if (e.target.closest("#btnMore")) moreOcc();
});

      <span class="lbl">${T("speed")}</span>

function rerender(){ if (!CUR) return; const last = store.get("last", {s:CUR.n, a:1}); render(); const el = document.getElementById("a"+last.a); if (el) el.scrollIntoView({block:"start"}); }

/* ---------- recitation player ---------- */
// Ayah audio: everyayah.com. Word timings: quran-align (CC-BY 4.0). Word audio: Quran.com CDN.
const AUDIO = "https://everyayah.com/data/";
const WBW_AUDIO = "https://audio.qurancdn.com/wbw/";
const p3 = n => String(n).padStart(3, "0");
const P = { audio: new Audio(), pre: new Audio(), s: 0, a: 0, bism: false, rep: 1, count: 0, T: null, liveKey: null, raf: 0, userScroll: 0 };
P.audio.preload = "auto"; P.pre.preload = "auto";
const REPS = [1, 3, 5, 0];
const recName = () => META.reciters.find(x => x[0] === settings.rec) || META.reciters[0];
const ICON_PLAY = '<path d="M8 5.5v13l11-6.5z"/>', ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

async function playFrom(s, a){
  if (!META.reciters.some(r => r[0] === settings.rec)) settings.rec = META.reciters[0][0];
  if (!CUR || CUR.n !== s) await openSurah(s, a);
  P.s = s; P.a = a; P.count = 0; P.T = null;
  document.body.classList.add("playing");
  $("#player").classList.add("on");
  P.bism = (a === 1 && s !== 1 && s !== 9);
  startAudio();  // start audio immediately, inside the tap, so phones allow it
  const rec = settings.rec;
  DATA.timing(rec).then(T => { if (settings.rec === rec) P.T = T; }).catch(() => {});
}
function startAudio(){
  const s = P.s, a = P.a;
  P.audio.src = P.bism ? `${AUDIO}${settings.rec}/001001.mp3` : `${AUDIO}${settings.rec}/${p3(s)}${p3(a)}.mp3`;
  P.audio.playbackRate = settings.speed;
  P.audio.play().catch(() => {});
  if (!P.bism && a < CUR.ayahs.length) P.pre.src = `${AUDIO}${settings.rec}/${p3(s)}${p3(a+1)}.mp3`;
  P.liveKey = null;
  updateBar();
  markAyah();
}
function updateBar(){
  const S = META.surahs[P.s-1], r = recName();
  $("#pTitle").textContent = `${settings.lang === "en" ? S.tr : S.ar} · ${P.bism ? T("bism") : T("ayah", P.a)}`;
  $("#pRec").textContent = settings.lang === "en" ? r[2] : r[1];
  $("#pRep").textContent = P.rep ? "×" + T("num", P.rep) : "∞";
  $("#pRep").setAttribute("aria-pressed", P.rep !== 1);
  if ("mediaSession" in navigator && window.MediaMetadata) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: `${S.tr} ${P.s}:${P.a}`, artist: r[2], album: "Quran" });
  }
}
function markAyah(){
  document.querySelectorAll(".ayah.playing").forEach(x => x.classList.remove("playing"));
  const el = document.getElementById("a" + P.a);
  if (!el || P.bism) return;
  el.classList.add("playing");
  if (Date.now() - P.userScroll > 4000) {
    const r = el.getBoundingClientRect();
    if (r.top < 70 || r.top > innerHeight * 0.55) el.scrollIntoView({ block: "start", behavior: "smooth" });
  }
}
function setLive(w0, w1){
  const key = w0 + ":" + w1 + ":" + P.a;
  if (key === P.liveKey) return;
  P.liveKey = key;
  document.querySelectorAll(".w.live").forEach(x => x.classList.remove("live"));
  if (w0 < 0) return;
  const el = document.getElementById("a" + P.a); if (!el) return;
  for (let i = w0; i < w1; i++) { const w = el.querySelector(`.w[data-i="${i}"]`); if (w) w.classList.add("live"); }
  const first = el.querySelector(`.w[data-i="${w0}"]`);
  if (first && Date.now() - P.userScroll > 4000) {
    const r = first.getBoundingClientRect();
    if (r.bottom > innerHeight - 90 || r.top < 70) first.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}
function tick(){
  P.raf = 0;
  if (P.audio.paused) return;
  if (!P.bism && P.T && P.T[P.s-1]) {
    const seg = P.T[P.s-1][P.a-1] || [], t = P.audio.currentTime * 1000;
    let hit = -1;
    for (let k = 0; k < seg.length; k += 4) { if (t >= seg[k+2]) hit = k; else break; }
    if (hit >= 0) setLive(seg[hit], seg[hit+1]); else setLive(-1, -1);
  }
  P.raf = requestAnimationFrame(tick);
}
P.audio.addEventListener("play", () => { $("#pIcon").innerHTML = ICON_PAUSE; if (!P.raf) P.raf = requestAnimationFrame(tick); });
P.audio.addEventListener("pause", () => { $("#pIcon").innerHTML = ICON_PLAY; });
P.audio.addEventListener("ended", () => {
  if (P.bism) { P.bism = false; startAudio(); return; }
  P.count++;
  if (P.rep === 0 || P.count < P.rep) { startAudio(); return; }
  P.count = 0;
  if (P.a < CUR.ayahs.length) { P.a++; startAudio(); }
  else { setLive(-1, -1); $("#pIcon").innerHTML = ICON_PLAY; toast(T("done")); }
});
P.audio.addEventListener("error", () => { if (P.s && P.audio.getAttribute("src")) toast(T("audioFail")); });
function stopPlayer(){
  P.audio.pause(); P.audio.removeAttribute("src"); P.s = 0;
  document.body.classList.remove("playing"); $("#player").classList.remove("on");
  document.querySelectorAll(".ayah.playing").forEach(x => x.classList.remove("playing"));
  setLive(-1, -1);
}
function step(d){
  if (!P.s) return;
  P.a = Math.min(Math.max(1, P.a + d), CUR.ayahs.length);
  P.bism = false; P.count = 0; startAudio();
}
$("#pPlay").onclick = () => { if (P.audio.paused) P.audio.play().catch(() => {}); else P.audio.pause(); };
$("#pNext").onclick = () => step(1);
$("#pPrev").onclick = () => step(-1);
$("#pClose").onclick = stopPlayer;
$("#pRep").onclick = () => {
  P.rep = REPS[(REPS.indexOf(P.rep) + 1) % REPS.length]; P.count = 0; updateBar();
  toast(P.rep === 1 ? T("rep1") : P.rep ? T("repN", P.rep) : T("repInf"));
};
$("#btnPlay").onclick = () => {
  if (P.s) { $("#pPlay").click(); return; }
  if (!CUR) return;
  const last = store.get("last", { s: CUR.n, a: 1 });
  playFrom(CUR.n, last.s === CUR.n ? last.a : 1);
};
["wheel", "touchmove"].forEach(ev => addEventListener(ev, () => { P.userScroll = Date.now(); }, { passive: true }));
if ("mediaSession" in navigator) {
  try {
    navigator.mediaSession.setActionHandler("play", () => P.audio.play());
    navigator.mediaSession.setActionHandler("pause", () => P.audio.pause());
    navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
    navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
  } catch(e) {}
}
function playWord(s, a, w){
  new Audio(`${WBW_AUDIO}${p3(s)}_${p3(a)}_${p3(w)}.mp3`).play().catch(() => toast(T("wordNA")));
}

function pickLanguage(){
  return new Promise(res => {
    const d = document.createElement("div");

  const r = LV.q[LV.i], t = today(), c = LS.c[r] || [0, t, 0];

function startMatch(){
  const W = LV.V.words, seen = W.filter(w => LS.c[w[0]]);

  const pick = [], used = new Set();
  for (const w of shuffle(pool.slice())) { const m = shortM(w[5]).toLowerCase(); if (!used.has(m) && m) { used.add(m); pick.push(w); } if (pick.length === 6) break; }
  LV.m = { words: pick, left: shuffle(pick.map(w => w[0])), right: shuffle(pick.map(w => w[0])), sel: null, ok: new Set(), t0: Date.now(), pen: 0 };

  const M = LV.m, el = $("#learn");

}

  bqName:"بیان القرآن — ڈاکٹر اسرار احمد", lqName:"لسان القرآن — استاد عامر سہیل", lecH:"لیکچرز", lec:n=>`لیکچر ${ud(n)}`, lesson:n=>`سبق ${ud(n)}`,

  cont:"جاری رکھیں", startS:"شروع کریں", openYT:"یوٹیوب پر دیکھیں", prevL:"پچھلا", nextL:"اگلا", via:s=>`آفیشل یوٹیوب ویڈیو · ${s}`,
  lqNote:"آفیشل چینل کی ویڈیوز (نئی پہلے)", getApp:"ان کی آفیشل ایپ", noLec:"اس آیت کا لیکچر نہیں ملا"
});
Object.assign(L.en, {
  bqName:"Bayan-ul-Quran — Dr. Israr Ahmad", lqName:"Lisan ul Quran — Ustad Amir Sohail", lecH:"Lectures", lec:n=>`Lecture ${n}`, lesson:n=>`Lesson ${n}`,
  lecAyahs:(a,b)=>`Ayahs ${a}–${b}`, intro:"Introduction", closing:"Closing speech", tafseerBtn:"Tafseer (Dr. Israr)", startAt:t=>`Continue at ${t}`,
  cont:"Continue", startS:"Start", openYT:"Watch on YouTube", prevL:"Previous", nextL:"Next", via:s=>`Official YouTube video · ${s}`,
  lqNote:"Videos from the official channel (newest first)", getApp:"Their official app", noLec:"No lecture found for this ayah"
});
const VS = Object.assign({ bq:{ n:0, t:{}, off:null }, lq:{ i:0, t:{} } }, store.get("vid", {}));
const saveV = () => store.set("vid", VS);
const mmss = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const key = (s, a) => s * 1000 + a;
const lecFor = (s, a) => (BQ.find(L => L[1] && key(L[1], L[2]) <= key(s, a) && key(s, a) <= key(L[3], L[4])) || [0])[0];
const lecsInSurah = s => BQ.filter(L => L[1] && key(L[1], L[2]) <= key(s, 999) && key(L[3], L[4]) >= key(s, 1));
function lecLabel(n, s){
  const L = BQ[n - 1];
  if (!L[1]) return n <= 4 ? T("intro") : T("closing");
  if (s) { const cnt = META.surahs[s - 1].ayahs || 999; const a = L[1] === s ? L[2] : 1, b = L[3] === s ? Math.min(L[4], cnt) : cnt; return T("lecAyahs", nf(a), nf(b)); }
  const nm = x => settings.lang === "en" ? META.surahs[x - 1].tr : META.surahs[x - 1].ar;
  const end = (x, a) => a === 999 ? nm(x) : `${nm(x)} ${nf(a)}`;
  return L[1] === L[3] ? `${nm(L[1])} ${L[4] === 999 && L[2] === 1 ? "" : nf(L[2]) + "–" + (L[4] === 999 ? "" : nf(L[4]))}`.trim() : `${end(L[1], L[2]) } – ${end(L[3], L[4])}`;
}
/* surah header: lectures covering this surah */
function lecStrip(s){
  const ls = lecsInSurah(s); if (!ls.length) return "";
  return `<div class="lecstrip"><div class="lh2">${esc(T("bqName"))}</div><div class="chips">${ls.map(L =>
    `<button class="chip" data-lec="${L[0]}"><b>${T("lec", nf(L[0]))}</b><span>${esc(lecLabel(L[0], s))}</span>${VS.bq.t[L[0]] ? `<i>${mmss(VS.bq.t[L[0]])}</i>` : ""}</button>`).join("")}</div></div>`;
}
/* player panel */
let YTP = null, ytReady = null, vCur = null, vTimer = 0;
function loadYT(){
  if (!ytReady) ytReady = new Promise(res => { window.onYouTubeIframeAPIReady = res; const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s); });
  return ytReady;
}
const bqIndex = n => { const o = VS.bq.off; return !o ? n - 1 : o.rev ? (VS.bq.total || 108) - n + o.k : n - 1 + o.k; };
function openLecture(series, n){
  vCur = { series, n };
  const S = SERIES[series], start = series === "bq" ? (VS.bq.t[n] || 0) : (VS.lq.t[n] || 0);
  const title = series === "bq" ? `${T("lec", nf(n))} · ${esc(lecLabel(n))}` : T("lesson", nf(n + 1));
  $("#vpanel").innerHTML = `<div class="vp-top"><button class="iconbtn" data-v="close" aria-label="${T("back")}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="vp-t"><b>${esc(T(series === "bq" ? "bqName" : "lqName"))}</b><small id="vpTitle">${title}</small></div></div>
    <div class="vp-frame"><div id="ytp"></div></div>
    <div class="vp-nav"><button class="btn ghost" data-v="prev">${T("prevL")}</button><button class="btn ghost" data-v="next">${T("nextL")}</button></div>
    <p class="vp-credit">${esc(T("via", S.credit))} · <a href="${S.src}" target="_blank" rel="noopener">${esc(series === "lq" ? T("getApp") : S.srcName)}</a> ·
      <a id="vpYT" href="https://www.youtube.com/playlist?list=${S.list}" target="_blank" rel="noopener">${T("openYT")}</a>${series === "lq" ? `<br>${T("lqNote")}` : ""}</p>`;
  $("#vpanel").classList.add("on"); $("#scrim").classList.add("on");
  if (P.s && !P.audio.paused) P.audio.pause();
  const idx = series === "bq" ? bqIndex(n) : n;
  loadYT().then(() => {
    if (YTP) { try { YTP.destroy(); } catch(e){} }
    YTP = new YT.Player("ytp", { host:"https://www.youtube-nocookie.com", width:"100%", height:"100%",
      playerVars:{ listType:"playlist", list:S.list, index:idx, start:Math.floor(start), rel:0, playsinline:1, modestbranding:1 },
      events:{ onStateChange: onYTState } });
  });
  clearInterval(vTimer); vTimer = setInterval(saveVid, 4000);
  if (series === "bq") { VS.bq.n = n; } else VS.lq.i = n;
  saveV();
}
function onYTState(e){
  if (e.data !== 1 || !vCur) return;
  const d = YTP.getVideoData ? YTP.getVideoData() : {}, idx = YTP.getPlaylistIndex();
  const yt = $("#vpYT"); if (yt && d.video_id) yt.href = `https://www.youtube.com/watch?v=${d.video_id}`;
  if (vCur.series === "lq") { if (idx !== vCur.n) { vCur.n = idx; VS.lq.i = idx; $("#vpTitle").textContent = T("lesson", nf(idx + 1)); saveV(); } return; }
  const m = /(\d{1,3})\s*\/\s*108/.exec(d.title || "");
  if (m && !VS.bq.off) {               // learn how the official playlist is ordered, once
    const num = +m[1], fwd = idx - num + 1;
    VS.bq.off = Math.abs(fwd) <= 6 ? { rev:false, k:fwd } : { rev:true, k:idx - (108 - num) }; saveV();
    if (num !== vCur.n) { openLecture("bq", vCur.n); return; }
  }
  if (m && +m[1] !== vCur.n) { vCur.n = +m[1]; VS.bq.n = vCur.n; $("#vpTitle").textContent = `${T("lec", nf(vCur.n))} · ${lecLabel(vCur.n)}`; saveV(); }
}
function saveVid(){
  if (!YTP || !vCur || !YTP.getCurrentTime) return;
  const t = YTP.getCurrentTime(); if (!(t > 5)) return;
  if (vCur.series === "bq") VS.bq.t[vCur.n] = Math.floor(t); else VS.lq.t[vCur.n] = Math.floor(t);
  saveV();
}
function closeVideo(){
  saveVid(); clearInterval(vTimer);
  if (YTP) { try { YTP.pauseVideo(); YTP.destroy(); } catch(e){} YTP = null; }
  $("#vpanel").classList.remove("on"); $("#vpanel").innerHTML = ""; $("#scrim").classList.remove("on"); vCur = null;
  if (LV.view === "learn") learnHome(); else if (CUR) { const st = document.querySelector(".lecstrip"); if (st) st.outerHTML = lecStrip(CUR.n); }
}
$("#vpanel").addEventListener("click", e => {
  const b = e.target.closest("[data-v]"); if (!b || !vCur) return;
  const v = b.dataset.v;
  if (v === "close") return closeVideo();
  saveVid();
  const max = vCur.series === "bq" ? 108 : 999, min = vCur.series === "bq" ? 1 : 0;
  const n = Math.min(max, Math.max(min, vCur.n + (v === "next" ? 1 : -1)));
  if (n !== vCur.n) openLecture(vCur.series, n);
});
$("#scrim").addEventListener("click", () => { if (vCur) closeVideo(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && vCur) closeVideo(); });
$("#main").addEventListener("click", e => { const c = e.target.closest("[data-lec]"); if (c) openLecture("bq", +c.dataset.lec); });
$("#sheetBody").addEventListener("click", e => { const c = e.target.closest("[data-lec]"); if (c) { closeAll(); openLecture("bq", +c.dataset.lec); } });
/* Learn tab card */
function lecturesCard(){
  const bn = VS.bq.n || 5, bt = VS.bq.t[bn] || 0, li = VS.lq.i || 0, lt = VS.lq.t[li] || 0;
  return `<div class="lh"><h3>${T("lecH")}</h3></div><div class="games">
    <button class="game" data-lecs="bq"><b>${esc(T("bqName"))}</b><small>${T("lec", nf(bn))} · ${esc(lecLabel(bn))}</small><small>${bt ? T("startAt", mmss(bt)) : (VS.bq.n ? T("cont") : T("startS"))}</small></button>
    <button class="game" data-lecs="lq"><b>${esc(T("lqName"))}</b><small>${T("lesson", nf(li + 1))}</small><small>${lt ? T("startAt", mmss(lt)) : (VS.lq.i ? T("cont") : T("startS"))}</small></button></div>`;
}
$("#learn").addEventListener("click", e => { const c = e.target.closest("[data-lecs]"); if (c) openLecture(c.dataset.lecs, c.dataset.lecs === "bq" ? (VS.bq.n || 5) : (VS.lq.i || 0)); });

/* ---------- start ---------- */
(async function(){
  applySettings();
  const metaP = DATA.meta();
  if (!settings.lang) {
    settings.lang = await pickLanguage();
    settings.tr = settings.lang === "en" ? "en2" : "ur";
    settings.gl = settings.lang === "en" ? "en" : "ur";
    saveSettings();
  }
  if (!settings.tr) settings.tr = settings.lang === "en" ? "en2" : "ur";
  if (!settings.gl) settings.gl = settings.lang === "en" ? "en" : "ur";
  applyLang();
  try { META = await metaP; }
  catch(e){ $("#main").innerHTML = `<div class="loading">${T("loadFail")}</div>`; return; }
  const last = store.get("last", null);
  await openSurah(last ? last.s : 1, last ? last.a : 1);
  if (last && (last.s !== 1 || last.a !== 1)) toast(esc(T("resume", settings.lang === "en" ? META.surahs[last.s-1].tr : META.surahs[last.s-1].ar, last.a)));
  if (!window.EMBED && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
