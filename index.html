<script>
/* Move to qurantosoul.com: the old GitHub Pages link forwards there and carries the
   reader's saved data (last ayah, settings) in the #hash (never sent to any server). */
(function(){
  try {
    if (location.hostname.endsWith("github.io")) {
      var d = {};
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("q_") === 0) d[k] = localStorage.getItem(k); }
      location.replace("https://qurantosoul.com/" + location.search + "#move=" + encodeURIComponent(JSON.stringify(d)));
      return;
    }
    var m = location.hash.match(/^#move=(.*)$/);
    if (m) {
      var data = JSON.parse(decodeURIComponent(m[1]));
      for (var key in data) if (key.indexOf("q_") === 0 && localStorage.getItem(key) === null) localStorage.setItem(key, data[key]);
      history.replaceState(null, "", location.pathname + location.search);
    }
  } catch (e) {}
})();
</script>
